<h1>Dead of Winner sound audition</h1>
<p class="n">One clip plays at a time. Faded rows are not generated yet. Tell me the ids to redo. Narrator: Jacob Eder is in the game; the audition group lets you compare Josh and Remmy on the same line.</p>

<script>
var ITEMS=[{"id":"amb-wind-loop","kind":"sfx","group":"ambience","note":"A steady cold winter wind blowing across open snow: a low continuous howl with soft gusts and a fine hiss of blown snow, even and seamless, no music, no voices, no birds","dur":10,"loop":true},{"id":"amb-generator-loop","kind":"sfx","group":"ambience","note":"A diesel generator humming far away across the snow: a muffled steady low engine drone with a faint rhythmic put-put, even and seamless, no music, no voices","dur":8,"loop":true},{"id":"amb-fire-loop","kind":"sfx","group":"ambience","note":"A cozy fire burning in a stove, close up: a constant dense bed of small soft crackles and hissing embers with a gentle warm flame roar, evenly continuous, no loud pops, no silence, seamless, no music, no voices","dur":8,"loop":true},{"id":"amb-moans-loop","kind":"sfx","group":"ambience","note":"A far-off chorus of undead moans carried on the winter wind: many distant low hollow groans overlapping, ghostly and faint, even and seamless, no music, no screams, no words","dur":10,"loop":true},{"id":"snow-creak","kind":"sfx","group":"ambience","note":"Boots stepping slowly on deep frozen snow: a dry squeaky creak and crunch of packed snow, two slow steps, no music, no voices","dur":1.2,"loop":false},{"id":"dice-3","kind":"sfx","group":"dice","note":"Three wooden dice shaken in a hand then thrown onto a hard wooden table: a quick rattle, then a clatter and tumble to a stop, no music, no voices","dur":1.3,"loop":false},{"id":"dice-4","kind":"sfx","group":"dice","note":"Four wooden dice shaken in a hand then thrown onto a hard wooden table: a quick rattle, then a clatter and tumble to a stop, no music, no voices","dur":1.4,"loop":false},{"id":"dice-5","kind":"sfx","group":"dice","note":"Five wooden dice shaken in a cupped hand then thrown onto a hard wooden table: a longer rattle, then a busy clatter and tumble to a stop, no music, no voices","dur":1.5,"loop":false},{"id":"dice-exposure","kind":"sfx","group":"dice","note":"One large heavy die rolling slowly on a wooden table: a deep wooden knocking tumble that slows and settles with a final low thud, ominous, no music, no voices","dur":1.5,"loop":false},{"id":"dice-single","kind":"sfx","group":"dice","note":"One small die dropped and skittering a short way across a wooden table before it stops, no music, no voices","dur":0.8,"loop":false},{"id":"food-bump","kind":"sfx","group":"dice","note":"A small wooden token tapped down onto a cardboard game board: one short soft knock and a faint cardboard tick, no music, no rattle","dur":0.5,"loop":false},{"id":"card-draw","kind":"sfx","group":"cards","note":"One playing card slid off the top of a deck and picked up: a soft paper swish and a light flick, no music, no voices","dur":0.6,"loop":false},{"id":"card-flip","kind":"sfx","group":"cards","note":"A single playing card flipped face up onto a felt table: a crisp short paper snap and a soft slap, no music, no voices","dur":0.5,"loop":false},{"id":"card-shuffle","kind":"sfx","group":"cards","note":"A deck of cards riffle-shuffled: a quick fluttering paper riffle and a tidy squaring tap at the end, no music, no voices","dur":1.4,"loop":false},{"id":"card-waste","kind":"sfx","group":"cards","note":"A card tossed onto a discard pile: a light paper flick and a soft slap on a stack of cards, no music, no voices","dur":0.6,"loop":false},{"id":"card-slide-crisis","kind":"sfx","group":"cards","note":"A single card slid face down across a wooden table and stopping under a pile: a long soft paper scrape and a tiny tap, no music, no voices","dur":0.9,"loop":false},{"id":"card-equip","kind":"sfx","group":"cards","note":"A leather strap buckled and a small metal clip snapping shut as gear is equipped: one crisp metallic click and a leather creak, no music, no voices","dur":0.7,"loop":false},{"id":"search-police","kind":"sfx","group":"search","note":"Someone rummaging through a metal police locker: a steel door rattling open, clinking keys and handcuffs, hands searching a metal box, no music, no voices","dur":1.4,"loop":false},{"id":"search-grocery","kind":"sfx","group":"search","note":"Hands rummaging among grocery shelves: rustling plastic packaging, clinking tin cans, a glass jar sliding, cardboard scraping, no music, no voices","dur":1.4,"loop":false},{"id":"search-school","kind":"sfx","group":"search","note":"Rummaging through a school classroom: a wooden desk drawer scraping open, pencils rolling, a metal locker door rattling, paper shuffling, no music, no voices","dur":1.4,"loop":false},{"id":"search-library","kind":"sfx","group":"search","note":"Pages of old books and loose papers shuffled and flipped through: dry paper rustling, a heavy book thudding onto a wooden shelf, quiet, no music, no voices","dur":1.4,"loop":false},{"id":"search-hospital","kind":"sfx","group":"search","note":"Rummaging through a hospital supply cabinet: a metal drawer sliding, plastic pill bottles rattling, rubber gloves snapping, glass vials clinking, no music, no voices","dur":1.4,"loop":false},{"id":"search-gas","kind":"sfx","group":"search","note":"A gas station fuel pump handle lifted and its nozzle clacking back: a squeaky metal lever, fuel sloshing in a jerrycan, a heavy rubber hose dragging, no music, no voices","dur":1.4,"loop":false},{"id":"barricade","kind":"sfx","group":"actions","note":"A hammer driving nails into wooden planks to barricade a door: three quick hard hammer blows on nails with wood creaking, no music, no voices","dur":1.4,"loop":false},{"id":"barricade-break","kind":"sfx","group":"actions","note":"A wooden barricade splintering as it is smashed from outside: loud cracking planks, nails shrieking, wood crashing down, no music, no voices","dur":1.4,"loop":false},{"id":"attract","kind":"sfx","group":"actions","note":"A glass bottle thrown and smashing on a distant street: a short whoosh, a clean glass shatter and tinkling shards, no music, no voices","dur":1.2,"loop":false},{"id":"clean-waste","kind":"sfx","group":"actions","note":"Heavy rubbish bags dragged across snowy ground: plastic bags rustling and scraping, then a dull thump as they are dropped, no music, no voices","dur":1.4,"loop":false},{"id":"melee-thud","kind":"sfx","group":"combat","note":"A baseball bat swung hard into something solid: a short whoosh then one dull heavy thud, no music, no voices, no screaming","dur":0.8,"loop":false},{"id":"gunshot","kind":"sfx","group":"combat","note":"A loud close single pistol gunshot outdoors: one very sharp, powerful, full-volume bang with a short echo rolling away over snow, no music, no voices, no reloading","dur":1.5,"loop":false},{"id":"zombie-drop","kind":"sfx","group":"combat","note":"A heavy body collapsing onto frozen ground: a dull heavy fall, a slump and a soft rattle of clothing, no music, no voices","dur":1.2,"loop":false},{"id":"zombie-growl","kind":"sfx","group":"combat","note":"A single low guttural undead groan and wet rasp, hollow and slow, no words, no music, no screaming","dur":1.5,"loop":false},{"id":"attack-scuffle","kind":"sfx","group":"survivor attack","note":"Two people scuffling and shoving: quick cloth scrapes, boots shuffling on a floor, a hard grunt of effort and a thump against a wall, no words, no music","dur":1.2,"loop":false},{"id":"card-snatch","kind":"sfx","group":"survivor attack","note":"A card snatched sharply out of a hand: a sudden quick paper snap and a short startled breath, no words, no music","dur":0.6,"loop":false},{"id":"wound-grunt","kind":"sfx","group":"exposure","note":"A man's short sharp grunt of pain as he is hit, a pained exhale through the teeth, no words, no music","dur":0.7,"loop":false},{"id":"frostbite-shiver","kind":"sfx","group":"exposure","note":"A person shivering violently from cold: teeth chattering rapidly, ragged shaky breaths, cloth trembling, no words, no music","dur":1.5,"loop":false},{"id":"bite-scream","kind":"sfx","group":"exposure","note":"A short terrified scream of a woman cut off sharply, then a choked gasp, no words, no music","dur":1.5,"loop":false},{"id":"heartbeat","kind":"sfx","group":"exposure","note":"A slow heavy human heartbeat: four deep muffled thumps, tense and ominous, no music, no voices","dur":2.5,"loop":false},{"id":"survivor-death","kind":"sfx","group":"exposure","note":"A short pained cry of a man collapsing and a heavy fall onto snow, no words, no music","dur":1.8,"loop":false},{"id":"crisis-bell","kind":"sfx","group":"colony","note":"A single cold iron bell tolling slowly: one deep strike with a long ringing decay across a frozen valley, no music, no voices","dur":2.5,"loop":false},{"id":"morale-drop","kind":"sfx","group":"colony","note":"A low cello note sinking downward in pitch with a cold wind gust, a sorrowful falling sweep, no drums, no voices","dur":2.2,"loop":false},{"id":"starvation-growl","kind":"sfx","group":"colony","note":"A hungry stomach growling loudly: a long low gurgling rumble in a quiet room, no words, no music","dur":1.8,"loop":false},{"id":"zombies-gate","kind":"sfx","group":"colony","note":"Zombies arriving at a gate: dull dragging footsteps in snow, many hands slapping and rattling a chain-link gate, low groaning, no music, no screams","dur":2.5,"loop":false},{"id":"overrun-crash","kind":"sfx","group":"colony","note":"A gate crashing open under a crowd of bodies: metal buckling and a loud crash, followed by a distant scream, no music","dur":2.5,"loop":false},{"id":"round-tick","kind":"sfx","group":"colony","note":"A heavy mechanical clock tick: one deep wooden clunk of a counter moving one notch, short and dry, no music, no voices","dur":0.6,"loop":false},{"id":"vote-tick","kind":"sfx","group":"social","note":"One slow clock tick, a single ominous tock in a silent room, no music, no voices","dur":0.6,"loop":false},{"id":"thumbs-clack","kind":"sfx","group":"social","note":"Several wooden pegs clacking down onto a table all at once: a sharp short staccato clatter of wood on wood, no music, no voices","dur":0.8,"loop":false},{"id":"exile-door","kind":"sfx","group":"social","note":"A heavy wooden door slammed shut hard in a cold hall with an iron bolt sliding across: a loud slam and a metal bolt clunk, no music, no voices","dur":1.5,"loop":false},{"id":"request-knock","kind":"sfx","group":"social","note":"Three firm knocks with a knuckle on a wooden door, knock knock knock, quiet room, no music, no voices","dur":1.2,"loop":false},{"id":"ui-click","kind":"sfx","group":"interface","note":"A soft single click of a wooden game piece placed on a table, very subtle and short, no music, no voices","dur":0.5,"loop":false},{"id":"objective-complete","kind":"sfx","group":"interface","note":"A short warm hopeful bell chime in a cold room: two soft glass bell notes rising, gentle decay, no music, no voices","dur":2,"loop":false},{"id":"footsteps-snow","kind":"sfx","group":"interface","note":"Three quick footsteps crunching through snow, boots on frozen powder, no music, no voices","dur":1.2,"loop":false},{"id":"nar-round-a","kind":"voice","group":"narrator","note":"Jacob Eder: Another day in the snow. The colony holds, for now.","dur":0,"loop":false},{"id":"nar-round-b","kind":"voice","group":"narrator","note":"Jacob Eder: A new round begins. The cold has not moved on.","dur":0,"loop":false},{"id":"nar-round-last","kind":"voice","group":"narrator","note":"Jacob Eder: The last round. Whatever happens now, happens now.","dur":0,"loop":false},{"id":"nar-crisis-a","kind":"voice","group":"narrator","note":"Jacob Eder: The colony meets a crisis. Hand in what you can spare.","dur":0,"loop":false},{"id":"nar-crisis-b","kind":"voice","group":"narrator","note":"Jacob Eder: Something has gone wrong again. Cards go in, face down.","dur":0,"loop":false},{"id":"nar-crisis-ok","kind":"voice","group":"narrator","note":"Jacob Eder: The colony weathers it. Barely.","dur":0,"loop":false},{"id":"nar-crisis-fail","kind":"voice","group":"narrator","note":"Jacob Eder: It was not enough. The colony pays for it.","dur":0,"loop":false},{"id":"nar-gate","kind":"voice","group":"narrator","note":"Jacob Eder: The dead have reached the gate.","dur":0,"loop":false},{"id":"nar-starve","kind":"voice","group":"narrator","note":"Jacob Eder: The stores run dry, and the colony goes hungry.","dur":0,"loop":false},{"id":"nar-morale-low","kind":"voice","group":"narrator","note":"Jacob Eder: Morale is almost gone. People are watching each other.","dur":0,"loop":false},{"id":"nar-vote-called","kind":"voice","group":"narrator","note":"Jacob Eder: A vote has been called. Someone here is not trusted.","dur":0,"loop":false},{"id":"nar-vote-count","kind":"voice","group":"narrator","note":"Jacob Eder: Three. Two. One.","dur":0,"loop":false},{"id":"nar-exiled","kind":"voice","group":"narrator","note":"Jacob Eder: Exiled. The door closes behind them, and the cold takes the rest.","dur":0,"loop":false},{"id":"nar-spared","kind":"voice","group":"narrator","note":"Jacob Eder: Not enough votes. They stay, and they will remember.","dur":0,"loop":false},{"id":"nar-objective-complete","kind":"voice","group":"narrator","note":"Jacob Eder: The colony's goal is met. Hold on to it.","dur":0,"loop":false},{"id":"nar-colony-falls","kind":"voice","group":"narrator","note":"Jacob Eder: The colony falls. The winter takes everyone who stayed.","dur":0,"loop":false},{"id":"nar-end-win","kind":"voice","group":"narrator","note":"Jacob Eder: You made it through the winter, and you were not alone.","dur":0,"loop":false},{"id":"nar-end-lose","kind":"voice","group":"narrator","note":"Jacob Eder: Some people left the colony alive. You were not among them.","dur":0,"loop":false},{"id":"nar-obj-x-weeks-of-darkness","kind":"voice","group":"objective intro","note":"Jacob Eder: Eight weeks of darkness. Outlast the winter, and be still standing when the last day ends.","dur":0,"loop":false},{"id":"nar-obj-kill-them","kind":"voice","group":"objective intro","note":"Jacob Eder: Kill them. Thin out the dead until only a handful are left walking.","dur":0,"loop":false},{"id":"nar-obj-find-a-cure","kind":"voice","group":"objective intro","note":"Jacob Eder: Find a cure. Gather medicine, enough for everyone who set out, and bring it home.","dur":0,"loop":false},{"id":"nar-obj-home-sweet-home","kind":"voice","group":"objective intro","note":"Jacob Eder: Home sweet home. Board up the colony, and every other place, until nothing gets through.","dur":0,"loop":false},{"id":"nar-obj-raiding-party","kind":"voice","group":"objective intro","note":"Jacob Eder: Raiding party. Strip two other places bare before the cold takes them.","dur":0,"loop":false},{"id":"nar-obj-leave-it-all-behind","kind":"voice","group":"objective intro","note":"Jacob Eder: Leave it all behind. Arm everyone, stock the food, and be ready to run.","dur":0,"loop":false},{"id":"nar-obj-stockpile","kind":"voice","group":"objective intro","note":"Jacob Eder: Stockpile. Fill the supply, bar the doors, and hoard enough to last.","dur":0,"loop":false},{"id":"nar-obj-winter-has-come","kind":"voice","group":"objective intro","note":"Jacob Eder: Winter has come. Keep feeding the fire, or the cold will finish this.","dur":0,"loop":false},{"id":"nar-obj-too-many-mouths","kind":"voice","group":"objective intro","note":"Jacob Eder: Too many mouths. Five rounds. Hold out for five rounds.","dur":0,"loop":false},{"id":"nar-obj-we-need-more-samples","kind":"voice","group":"objective intro","note":"Jacob Eder: We need more samples. Every dead one may carry something worth taking.","dur":0,"loop":false},{"id":"sample-narrator","kind":"voice","group":"narrator audition","note":"Jacob Eder: Another night. The fire is low, the gate is thin, and someone in this room is lying.","dur":0,"loop":false},{"id":"sample-alt-josh","kind":"voice","group":"narrator audition","note":"Josh: Another night. The fire is low, the gate is thin, and someone in this room is lying.","dur":0,"loop":false},{"id":"sample-alt-remmy","kind":"voice","group":"narrator audition","note":"Remmy: Another night. The fire is low, the gate is thin, and someone in this room is lying.","dur":0,"loop":false},{"id":"vo-xr-annaleigh-chan","kind":"voice","group":"crossroads","note":"Jacob Eder: Annaleigh is in the old holding block with the cell keys in her hand and one name she cannot stop repeating. What she does with the next few minutes will tell the colony what kind of person she turned out to be.","dur":0,"loop":false},{"id":"vo-xr-arthur-thurston","kind":"voice","group":"crossroads","note":"Jacob Eder: The feral kids have trailed Arthur for blocks, a ragged line of faces with nothing behind the eyes. They close in around the cart he is guarding, and he knows how this ends whichever way he leans.","dur":0,"loop":false},{"id":"vo-xr-bev-russell","kind":"voice","group":"crossroads","note":"Jacob Eder: Bev stops at the school gate without meaning to, and the playground swing is still moving. Someone small is waiting in the shadow of the stairwell, and she has to decide what she can live with before she takes another step.","dur":0,"loop":false},{"id":"vo-xr-bitter-cold-night","kind":"voice","group":"crossroads","note":"Jacob Eder: Ice has sealed the seams of the doorframe and the wind keeps trying every gap. Behind the door a small group has a stove barely warm enough to matter, and outside a half-frozen traveller is scratching at the wood.","dur":0,"loop":false},{"id":"vo-xr-book-of-the-dead","kind":"voice","group":"crossroads","note":"Jacob Eder: Inside a locked case at the back of the library sits a huge hand-lettered volume with a cracked spine. It is heavy enough to be a weapon and odd enough to be a treasure, and you only have room in your pack for one idea of what it is for.","dur":0,"loop":false},{"id":"vo-xr-brian-lee","kind":"voice","group":"crossroads","note":"Jacob Eder: Brian pins a sketched floor plan to the wall and calls the whole colony to look. He says the colony has been scraping by on bad luck, and that tonight it can start taking what it needs.","dur":0,"loop":false},{"id":"vo-xr-carla-thompson","kind":"voice","group":"crossroads","note":"Jacob Eder: The house Carla is combing is not as empty as it looked from the road. Something in a stained coat paces the upper landing, one hand resting on a holster, and its head turns slowly toward the stairs.","dur":0,"loop":false},{"id":"vo-xr-christmas","kind":"voice","group":"crossroads","note":"Jacob Eder: Someone has tied scraps of foil to a coat rack and called it a tree. When an old cook asks if the stores can spare a real meal for one evening, the whole hall holds its breath.","dur":0,"loop":false},{"id":"vo-xr-crazed-survivor","kind":"voice","group":"crossroads","note":"Jacob Eder: A collapsed lean-to rattles and a gaunt woman bursts from it with a length of rebar and nothing in her eyes that you can reason with. She is guarding a stash under the planks.","dur":0,"loop":false},{"id":"vo-xr-david-garcia","kind":"voice","group":"crossroads","note":"Jacob Eder: David has audited the stores three nights running, and the numbers refuse to close. Either someone is quietly pocketing rations, or he has made a mistake in front of everyone, and he has to commit to one of those stories now.","dur":0,"loop":false},{"id":"vo-xr-heads-up","kind":"voice","group":"crossroads","note":"Jacob Eder: The evidence room has two containers still sealed: a battered cooler and a steel drum. Whichever one you pry open, something inside is going to scream back at you.","dur":0,"loop":false},{"id":"vo-xr-hunted","kind":"voice","group":"crossroads","note":"Jacob Eder: The wound is too clean to be a bite. It is a burn across the ribs where a bullet skimmed past, and the tracks in the snow beyond the hedge belong to boots, not shuffling feet. Somebody is out there, patient and warm, and they have chosen the colony as their quarry.","dur":0,"loop":false},{"id":"vo-xr-jenny-clark","kind":"voice","group":"crossroads","note":"Jacob Eder: On the long road a lone shape is limping forward with a loose crowd of the dead behind her. The lookout knows the walk before the face, and the rifle is already up.","dur":0,"loop":false},{"id":"vo-xr-little-survivors","kind":"voice","group":"crossroads","note":"Jacob Eder: Tiny boot prints cross the stairwell dust and end at a boiler room door. When the survivor calls out, a handful of faces appear behind a stack of crates, quiet and watchful, as if they have practised hiding for a long time.","dur":0,"loop":false},{"id":"vo-xr-lovers-quarrel","kind":"voice","group":"crossroads","note":"Jacob Eder: Two people who shared a tent for weeks start trading the kind of accusations that cannot be unsaid, in the open, with the whole block listening. One of them will have to give ground before the dead decide for them.","dur":0,"loop":false},{"id":"vo-xr-maude","kind":"voice","group":"crossroads","note":"Jacob Eder: The freezer aisle still hums with cold, and one stocked shelf looks untouched since the last delivery. A faded hand-painted sign above it says take only what you need, and for some reason it makes the survivor think of Maude.","dur":0,"loop":false},{"id":"vo-xr-old-divisions","kind":"voice","group":"crossroads","note":"Jacob Eder: Two shifts collide in the supply corridor and a shoving match turns ugly when one of them starts listing who does not belong here. Voices rally behind him from the back, and for a moment the colony looks ready to split along lines the world already erased. It falls to the table to say what kind of place this will be.","dur":0,"loop":false},{"id":"vo-xr-outbreak","kind":"voice","group":"crossroads","note":"Jacob Eder: Marlow stopped eating on Tuesday, and by Friday there is a blistered rash climbing his arms and a smell in the dormitory that people are trying not to name. Two cots away, a child has started to cough. The table must say what happens to the ones who cannot defend themselves.","dur":0,"loop":false},{"id":"vo-xr-outsiders","kind":"voice","group":"crossroads","note":"Jacob Eder: A rusted truck idles at the gate with its lights off, its bed crowded with silent faces under blankets. The driver steps down slowly, hands open, and asks whether there is room for a winter.","dur":0,"loop":false},{"id":"vo-xr-rascals","kind":"voice","group":"crossroads","note":"Jacob Eder: In a corner of the hospital activity room waits a karaoke machine, a crate of board games and three working car batteries. It is enough to put on a real party for the colony, if you do not mind the noise.","dur":0,"loop":false},{"id":"pv-hardcase-turn-start-0","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: My turn. Stay out of the way.","dur":0,"loop":false},{"id":"pv-hardcase-turn-start-1","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: Gate first. Talk later.","dur":0,"loop":false},{"id":"pv-hardcase-crisis-prevented-0","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: Good. Don't make me count on you twice.","dur":0,"loop":false},{"id":"pv-hardcase-crisis-prevented-1","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: Held. Barely. Moving on.","dur":0,"loop":false},{"id":"pv-hardcase-crisis-failed-0","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: Short. Someone is playing us.","dur":0,"loop":false},{"id":"pv-hardcase-crisis-failed-1","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: That's not bad luck. That's a hand on the scale.","dur":0,"loop":false},{"id":"pv-hardcase-vote-called-0","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: About time someone put them up.","dur":0,"loop":false},{"id":"pv-hardcase-vote-called-1","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: That one on the block. I'm listening.","dur":0,"loop":false},{"id":"pv-hardcase-vote-lean-yes-0","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: That one goes out. Yes.","dur":0,"loop":false},{"id":"pv-hardcase-vote-lean-yes-1","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: I've seen enough of them. Yes.","dur":0,"loop":false},{"id":"pv-hardcase-vote-lean-no-0","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: No. That one hasn't earned the boot yet.","dur":0,"loop":false},{"id":"pv-hardcase-vote-lean-no-1","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: Not them. Not on this. No.","dur":0,"loop":false},{"id":"pv-hardcase-request-give-0","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: Take it, friend. Don't waste it.","dur":0,"loop":false},{"id":"pv-hardcase-request-give-1","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: One time, friend. Make it count.","dur":0,"loop":false},{"id":"pv-hardcase-request-decline-0","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: No, friend.","dur":0,"loop":false},{"id":"pv-hardcase-request-decline-1","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: Find it elsewhere, friend.","dur":0,"loop":false},{"id":"pv-hardcase-exposure-bite-0","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: One of ours is down. Keep the line tight.","dur":0,"loop":false},{"id":"pv-hardcase-exposure-bite-1","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: Lost one of ours. Nobody cry, work.","dur":0,"loop":false},{"id":"pv-hardcase-morale-low-0","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: We're nearly dead. Act like it matters.","dur":0,"loop":false},{"id":"pv-hardcase-morale-low-1","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: One more bad round and it's over. Think.","dur":0,"loop":false},{"id":"pv-hardcase-game-won-0","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: Still breathing. Good enough.","dur":0,"loop":false},{"id":"pv-hardcase-game-won-1","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: We lived. Don't get soft.","dur":0,"loop":false},{"id":"pv-hardcase-game-lost-0","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: Should have voted sooner.","dur":0,"loop":false},{"id":"pv-hardcase-game-lost-1","kind":"voice","group":"persona: Ruth Castellano","note":"Katie: That's the winter. It always wins eventually.","dur":0,"loop":false},{"id":"pv-optimist-turn-start-0","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: Okay team, deep breath. We've got this.","dur":0,"loop":false},{"id":"pv-optimist-turn-start-1","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: New turn, fresh luck. Let's go.","dur":0,"loop":false},{"id":"pv-optimist-crisis-prevented-0","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: Ha! We did it! Look at us!","dur":0,"loop":false},{"id":"pv-optimist-crisis-prevented-1","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: Told you. Teamwork wins the winter.","dur":0,"loop":false},{"id":"pv-optimist-crisis-failed-0","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: Ouch. Okay. We'll get the next one.","dur":0,"loop":false},{"id":"pv-optimist-crisis-failed-1","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: Short by a few, but nobody panic.","dur":0,"loop":false},{"id":"pv-optimist-vote-called-0","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: A vote on them? Let's be gentle about it.","dur":0,"loop":false},{"id":"pv-optimist-vote-called-1","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: Oh. A vote on them. Let's hear it out first.","dur":0,"loop":false},{"id":"pv-optimist-vote-lean-yes-0","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: I hate this, but it's yes on them.","dur":0,"loop":false},{"id":"pv-optimist-vote-lean-yes-1","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: Sorry. The signs are too loud. Yes.","dur":0,"loop":false},{"id":"pv-optimist-vote-lean-no-0","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: No way, not them. Give them a break.","dur":0,"loop":false},{"id":"pv-optimist-vote-lean-no-1","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: I trust them. That's a no from me.","dur":0,"loop":false},{"id":"pv-optimist-request-give-0","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: Sure thing, friend! Take it.","dur":0,"loop":false},{"id":"pv-optimist-request-give-1","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: Happy to help, friend. Pay it forward.","dur":0,"loop":false},{"id":"pv-optimist-request-decline-0","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: Oh friend, I really wish I could.","dur":0,"loop":false},{"id":"pv-optimist-request-decline-1","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: Ugh, sorry friend. I'm holding this one back.","dur":0,"loop":false},{"id":"pv-optimist-exposure-bite-0","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: No... not one of ours. They deserved better.","dur":0,"loop":false},{"id":"pv-optimist-exposure-bite-1","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: Rest easy, one of ours. We'll keep going.","dur":0,"loop":false},{"id":"pv-optimist-morale-low-0","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: Still hanging on! We just need one good round.","dur":0,"loop":false},{"id":"pv-optimist-morale-low-1","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: Hearts up, everyone. It's not over.","dur":0,"loop":false},{"id":"pv-optimist-game-won-0","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: We survived! Group hug, everybody!","dur":0,"loop":false},{"id":"pv-optimist-game-won-1","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: I knew it! What a crew.","dur":0,"loop":false},{"id":"pv-optimist-game-lost-0","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: Well. That didn't go how I hoped.","dur":0,"loop":false},{"id":"pv-optimist-game-lost-1","kind":"voice","group":"persona: Teddy Marchbanks","note":"Will: I'm sorry, everyone. We gave it all.","dur":0,"loop":false},{"id":"pv-quartermaster-turn-start-0","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: Stores first. Then everything else.","dur":0,"loop":false},{"id":"pv-quartermaster-turn-start-1","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: I counted the pantry again. Let's not be wasteful.","dur":0,"loop":false},{"id":"pv-quartermaster-crisis-prevented-0","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: Covered, and with nothing wasted. Good.","dur":0,"loop":false},{"id":"pv-quartermaster-crisis-prevented-1","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: That's the shortfall closed. Write it down.","dur":0,"loop":false},{"id":"pv-quartermaster-crisis-failed-0","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: We came up short. Somebody's numbers were off.","dur":0,"loop":false},{"id":"pv-quartermaster-crisis-failed-1","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: That is a bad ledger. Remember it.","dur":0,"loop":false},{"id":"pv-quartermaster-vote-called-0","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: A vote on them. Fine. Let's see the figures.","dur":0,"loop":false},{"id":"pv-quartermaster-vote-called-1","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: Calling it on them? Then it had better add up.","dur":0,"loop":false},{"id":"pv-quartermaster-vote-lean-yes-0","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: The sums keep pointing at them. I'm voting yes.","dur":0,"loop":false},{"id":"pv-quartermaster-vote-lean-yes-1","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: That one's account doesn't balance. Yes.","dur":0,"loop":false},{"id":"pv-quartermaster-vote-lean-no-0","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: Not enough against them. I vote no.","dur":0,"loop":false},{"id":"pv-quartermaster-vote-lean-no-1","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: I can't make the case for them. No.","dur":0,"loop":false},{"id":"pv-quartermaster-request-give-0","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: Here, friend. That comes out of my share.","dur":0,"loop":false},{"id":"pv-quartermaster-request-give-1","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: Take it, friend. Use it well.","dur":0,"loop":false},{"id":"pv-quartermaster-request-decline-0","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: Sorry friend, I can't spare it.","dur":0,"loop":false},{"id":"pv-quartermaster-request-decline-1","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: Not this time, friend. I need what I hold.","dur":0,"loop":false},{"id":"pv-quartermaster-exposure-bite-0","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: One of ours is gone. One less mouth, one more hole.","dur":0,"loop":false},{"id":"pv-quartermaster-exposure-bite-1","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: We lost one of ours. Keep moving.","dur":0,"loop":false},{"id":"pv-quartermaster-morale-low-0","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: Morale is nearly out. Every decision counts now.","dur":0,"loop":false},{"id":"pv-quartermaster-morale-low-1","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: We are close to the edge. No more gambles.","dur":0,"loop":false},{"id":"pv-quartermaster-game-won-0","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: The books balance. We lived.","dur":0,"loop":false},{"id":"pv-quartermaster-game-won-1","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: Well run, all of you.","dur":0,"loop":false},{"id":"pv-quartermaster-game-lost-0","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: We ran out of everything at once.","dur":0,"loop":false},{"id":"pv-quartermaster-game-lost-1","kind":"voice","group":"persona: Vera Lindqvist","note":"Evelyn: The ledger is closed. We lost.","dur":0,"loop":false},{"id":"music-title","kind":"music","group":"title","note":"Cold intimate instrumental title theme for a winter survival drama: a slow sparse solo piano melody in a minor key over a soft bed of wind, low bowed cello and quiet sustained strings, wide empty reverb, melancholic but quietly hopeful, no vocals, no drums, no percussion, a gentle ending that can loop back to the start","dur":75,"loop":true},{"id":"music-tension","kind":"music","group":"tension","note":"Tense suspense underscore for a crisis and a vote: low pulsing string ostinato slowly growing, dissonant sustained violins, a deep muted heartbeat-like pulse and soft muted drum hits, cold and dread-filled, steady and loopable, no vocals, no melody, no big climax","dur":60,"loop":true},{"id":"music-victory","kind":"music","group":"stinger","note":"A short hopeful stinger as dawn breaks over a frozen colony: warm piano and strings rising into a gentle major chord that rings out and fades, quiet relief, no vocals, no drums","dur":10,"loop":false},{"id":"music-defeat","kind":"music","group":"stinger","note":"A short somber stinger as a colony falls: low cello and piano sinking into a hollow minor chord that fades away into cold wind, bleak and final, no vocals, no drums","dur":10,"loop":false},{"id":"music-colony-a","kind":"music","group":"colony","note":"Low-intensity ambient underscore for a besieged winter colony: sparse single piano notes with long silences, soft sustained string pads, distant wind, calm and watchful, steady and even in volume with no build and no climax, cold and intimate, no vocals, no drums, no percussion","dur":120,"loop":true},{"id":"music-colony-b","kind":"music","group":"colony","note":"Low-intensity ambient underscore for a besieged winter colony: a warm low cello drone and muted slow piano arpeggios, soft strings, faint creaking wood and wind, a quiet firelit mood, steady and even in volume with no build and no climax, no vocals, no drums, no percussion","dur":120,"loop":true}];

var cur=null,curRow=null;
function path(i){return i.kind==='music'?'audio/music/'+i.id+'.mp3':'audio/'+i.id+'.mp3'}
function stop(){if(cur){cur.pause();cur.currentTime=0}if(curRow)curRow.classList.remove('playing');cur=null;curRow=null}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
var root=document.getElementById('root');
[['sfx','Sound effects'],['voice','Voices'],['music','Music']].forEach(function(s){
